name: airnet-assessment
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: airnet_assessment
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment_demo
    volumes:
      - assessment-db:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U assessment -d airnet_assessment"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: ./backend
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: airnet_assessment
      PGUSER: assessment
      PGPASSWORD: assessment_demo
      DEMO_LATENCY: "1"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8080/api/health') === false ? 1 : 0);"]
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_TARGET: http://api:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - assessment-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
volumes:
  assessment-db:
  assessment-node-modules:
